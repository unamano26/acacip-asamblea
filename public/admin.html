<meta charset="utf-8">

<body>
<main class="wrap wide" id="app">
  <section class="badge">
    <div class="badge-top"><span class="logo-mark" role="img" aria-label="Logo ACACIP"></span>
      <div class="tx"><div class="org">ACACIP · MESA</div><h1>Asamblea General<b>Panel de la mesa</b></h1></div></div>
  </section>
  <div id="view"></div>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="archivo" accept=".xlsx,.xls,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>
<script>
(function(){
var view=document.getElementById('view'), PK='asamblea-admin';
var st={hab:{dni:'',nombre:''},asis:null,pw:'',tab:'mociones',resumen:null,cargando:false,loginMsg:'',borrar:null,preview:null,previewErr:'',buscar:{q:'',res:null},nueva:{titulo:'',detalle:'',tipo:'sino',opciones:['','',''],abstencion:false},editando:null,resetPres:false};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function sget(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function sput(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v);}catch(e){}}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true;},2600);}
function api(path,method,body){
  return fetch('/api/admin/'+path,{method:method||'GET',headers:{'content-type':'application/json','x-admin-password':st.pw},body:body?JSON.stringify(body):undefined})
  .then(function(r){return r.json().catch(function(){return {ok:false,mensaje:'Respuesta inválida del servidor.'};}).then(function(j){j._status=r.status;if(r.status===401&&path!=='login'){st.pw='';sput(PK,null);render();}return j;});},function(){return {ok:false,mensaje:'Sin conexión.'};});
}
var NOMBRES={positivo:'Sí',negativo:'No',abstencion:'Abstención'};
function fmtFecha(iso){if(!iso)return '—';var d=new Date(iso);return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}

/* ---------- Acceso ---------- */
function loginView(){
  return '<form class="card" id="login" style="max-width:420px;align-self:center;width:100%"><h3>Ingreso de la mesa</h3>'+
  '<div class="field"><label for="pw">Contraseña</label><input type="password" id="pw" autocomplete="current-password" required></div>'+
  (st.loginMsg?'<div class="status no" role="alert"><p>'+esc(st.loginMsg)+'</p></div>':'')+
  '<button class="btn primary block" type="submit">Entrar</button></form>';
}

/* ---------- Resumen y consignas ---------- */
function cargar(){return api('resumen').then(function(r){if(r.ok){st.resumen=r;render();}});}
function statsHtml(){
  var r=st.resumen;if(!r)return '<p class="muted">Cargando…</p>';
  return '<div class="stats"><div class="stat"><span class="label">Pueden votar (presentes)</span><b>'+r.presentes+'</b><span class="hint">socios habilitados que ingresaron</span></div>'+
  '<div class="stat"><span class="label">Asistentes sin voto</span><b>'+(r.asistentes||0)+'</b><span class="hint">acreditados que no pueden votar</span></div>'+
  '<div class="stat"><span class="label">Padrón habilitado</span><b>'+r.padron.activos+'</b><span class="hint">socios que pueden votar</span></div>'+
  '<div class="stat"><span class="label">Consignas</span><b>'+r.mociones.length+'</b><span class="hint">'+r.mociones.filter(function(m){return m.estado==='abierta';}).length+' abiertas</span></div></div>';
}
function clase(id){return NOMBRES[id]?id:'alt';}
function barras(m){
  var res=m.resultados,t=res.total||0;
  return '<div class="bars">'+m.opciones.map(function(o){var k=o.id,n=res[k]||0,p=t?Math.round(n*1000/t)/10:0;
    return '<div class="bar '+clase(k)+'"><span>'+esc(o.texto)+'</span><span class="track"><span class="fill" style="width:'+p+'%;display:block"></span></span><span class="n">'+n+'</span></div>';}).join('')+'</div>';
}
function mocionAdmin(m,i,n){
  var pres=st.resumen.presentes;
  var h='<article class="card"><div class="spread"><span class="label">Consigna '+(i+1)+'</span><span class="pill '+m.estado+'">'+({borrador:'Borrador',abierta:'Votación abierta',cerrada:'Cerrada'})[m.estado]+'</span></div>';
  if(st.editando===m.id){
    h+='<div class="field"><label for="et-'+m.id+'">Consigna</label><input id="et-'+m.id+'" value="'+esc(m.titulo)+'"></div><div class="field"><label for="ed-'+m.id+'">Detalle (opcional)</label><textarea id="ed-'+m.id+'">'+esc(m.detalle)+'</textarea></div>'+
    (m.tipo==='opciones'?'<div class="field"><label for="eo-'+m.id+'">Opciones (una por línea)</label><textarea id="eo-'+m.id+'">'+esc((m.opciones||[]).filter(function(o){return o.id!=='abstencion';}).map(function(o){return o.texto;}).join('\n'))+'</textarea></div>':'')+
    '<div class="row"><button class="btn primary small" data-guardar="'+m.id+'">Guardar</button><button class="btn ghost small" data-cancelar="1">Cancelar</button></div>';
  } else {
    h+='<h3>'+esc(m.titulo)+'</h3>'+(m.detalle?'<p class="muted" style="white-space:pre-line">'+esc(m.detalle)+'</p>':'');
  }
  if(m.estado==='borrador'&&st.editando!==m.id){
    h+='<div class="row">'+m.opciones.map(function(o,j){return '<span class="pill borrador" style="text-transform:none;letter-spacing:0;font-size:13px">'+(NOMBRES[o.id]?'':String.fromCharCode(65+j)+'. ')+esc(o.texto)+'</span>';}).join('')+'</div>';
  }
  if(m.estado!=='borrador'){
    h+=barras(m)+'<p class="hint">'+m.resultados.total+' votos emitidos · '+m.votantes+' socios votaron'+(pres?' · '+Math.round(m.votantes*100/pres)+'% de los presentes':'')+'</p>';
  }
  h+='<div class="row">';
  if(m.estado==='borrador')h+='<button class="btn primary small" data-estado="abierta" data-id="'+m.id+'">Abrir votación</button>';
  if(m.estado==='abierta')h+='<button class="btn primary small" data-estado="cerrada" data-id="'+m.id+'">Cerrar votación</button>';
  if(m.estado==='cerrada'){
    h+='<button class="btn ghost small" data-estado="abierta" data-id="'+m.id+'">Reabrir</button>';
  }
  if(m.estado==='borrador'&&st.editando!==m.id)h+='<button class="btn ghost small" data-editar="'+m.id+'">Editar</button>';
  if(i>0)h+='<button class="btn ghost small" data-mover="-1" data-id="'+m.id+'" aria-label="Subir">↑</button>';
  if(i<n-1)h+='<button class="btn ghost small" data-mover="1" data-id="'+m.id+'" aria-label="Bajar">↓</button>';
  h+='<button class="btn danger small" data-borrar="'+m.id+'">Eliminar</button></div>';
  if(st.borrar===m.id)h+='<div class="status no"><p>Se elimina la consigna y todos sus votos. No se puede deshacer.</p><div class="row"><button class="btn danger small" data-borrarok="'+m.id+'">Sí, eliminar</button><button class="btn ghost small" data-cancelar="1">Cancelar</button></div></div>';
  return h+'</article>';
}
function mocionesView(){
  var r=st.resumen;
  var h='<form class="card" id="nueva"><h3>Nueva consigna</h3><div class="field"><label for="n-titulo">Consigna a votar</label><input id="n-titulo" placeholder="Ej.: Aprobación de la memoria y balance 2025-2026" value="'+esc(st.nueva.titulo)+'"></div>'+
  '<div class="field"><label for="n-detalle">Detalle (opcional)</label><textarea id="n-detalle" placeholder="Texto que van a leer los socios antes de votar">'+esc(st.nueva.detalle)+'</textarea></div>'+
  '<fieldset class="tipo"><legend class="label" style="margin-bottom:6px">Tipo de votación</legend><div class="row">'+
  '<label class="btn ghost small"><input type="radio" name="n-tipo" value="sino"'+(st.nueva.tipo==='sino'?' checked':'')+'> Sí / No</label>'+
  '<label class="btn ghost small"><input type="radio" name="n-tipo" value="opciones"'+(st.nueva.tipo==='opciones'?' checked':'')+'> Elegir entre opciones</label></div></fieldset>'+
  (st.nueva.tipo==='opciones'?'<div class="field"><span class="label">Opciones (cada socio elige una)</span>'+st.nueva.opciones.map(function(o,j){return '<div class="row"><input id="n-op-'+j+'" aria-label="Opción '+String.fromCharCode(65+j)+'" placeholder="Opción '+String.fromCharCode(65+j)+(j===0?' · ej.: Córdoba':'')+'" value="'+esc(o)+'" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px">'+(st.nueva.opciones.length>2?'<button type="button" class="btn ghost small" data-quitarop="'+j+'" aria-label="Quitar opción">Quitar</button>':'')+'</div>';}).join('')+
    '<div class="row">'+(st.nueva.opciones.length<8?'<button type="button" class="btn ghost small" data-agregarop="1">+ Agregar opción</button>':'')+'<label class="hint check"><input type="checkbox" id="n-abs"'+(st.nueva.abstencion?' checked':'')+'> Incluir “Abstención”</label></div></div>':'')+
  '<div class="row"><button class="btn primary" type="submit">Agregar consigna</button><span class="hint">Se crea como borrador. Los socios la ven recién cuando abrís la votación, y deja de aparecerles al cerrarla.</span></div></form>';
  if(r&&r.mociones.length)h+=r.mociones.map(function(m,i){return mocionAdmin(m,i,r.mociones.length);}).join('');
  else if(r)h+='<p class="muted">Todavía no hay consignas cargadas.</p>';
  if(r&&r.mociones.some(function(m){return m.estado!=='borrador';}))h+='<button class="btn ghost" data-csv="1" style="align-self:flex-start">Descargar resultados (CSV)</button>';
  return h;
}

/* ---------- Padrón ---------- */
function normHead(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function esActivo(v){var s=normHead(v);if(s==='')return true;return /^(si|s|activo|activa|habilitado|habilitada|1|true|x|al dia|ok)$/.test(s);}
function interpretar(rows){
  rows=rows.filter(function(r){return r&&r.some(function(c){return String(c==null?'':c).trim()!=='';});});
  if(!rows.length)return {error:'El archivo no tiene filas.'};
  /* Busca la fila de títulos (puede no ser la primera: planillas con logo o título arriba). */
  var hi=-1;for(var x=0;x<Math.min(rows.length,40);x++){if(rows[x].some(function(c){return /^(dni|documento|nro\.? de documento|n° documento|doc\.?)$/.test(normHead(c));})){hi=x;break;}}
  var iD=-1,iN=-1,iA=-1,iAp=-1,iC=-1,datos=rows;
  if(hi>=0){
    var head=rows[hi].map(normHead);
    head.forEach(function(h,i){
      if(iD<0&&/^(dni|documento|nro\.? de documento|n° documento|doc\.?)$/.test(h))iD=i;
      else if(iA<0&&/^(estado|activo|activa|habilitado|habilitada|condicion|vota|puede votar)$/.test(h))iA=i;
      else if(iC<0&&/^(categoria|categoria de socio|tipo de socio)$/.test(h))iC=i;
      else if(iAp<0&&/^apellidos?$/.test(h))iAp=i;
      else if(iN<0&&/^(nombres?|socio|apellido y nombre|nombre y apellido)$/.test(h))iN=i;
    });
    datos=rows.slice(hi+1);
  } else { /* sin encabezado: DNI, nombre, activo */
    iD=0;iN=1;iA=rows[0].length>2?2:-1;
  }
  var socios=[],invalidos=[],vistos={},dup=0;
  datos.forEach(function(r,ix){
    var crudo=String(r[iD]==null?'':r[iD]);
    var d=crudo.replace(/\D/g,'').replace(/^0+/,'');
    /* Cédulas con dígito verificador (ej. "CI 1360492-4"): también se acepta sin el dígito. */
    var mg=crudo.match(/(\d[\d.,\s]*)-\s*\d\s*$/), alias=mg?mg[1].replace(/\D/g,'').replace(/^0+/,''):'';
    var nom=[iAp>=0?r[iAp]:'',iN>=0?r[iN]:''].map(function(x){return String(x==null?'':x).trim();}).filter(Boolean).join(', ');
    if(!/^\d{6,12}$/.test(d)){if(d||nom)invalidos.push((nom||'fila '+(ix+hi+2))+': '+String(r[iD]||'(sin DNI)'));return;}
    if(vistos[d]){dup++;}
    vistos[d]=true;
    /* Votan Titulares y Vitalicios (en cualquiera de sus variantes); si no hay columna de categoría, se usa Estado. */
    var activo=iC>=0?/(titular|vital)/.test(normHead(r[iC])):(iA>=0?esActivo(r[iA]):true);
    socios.push({dni:d,nombre:nom,activo:activo,alias:(alias&&alias!==d&&/^\d{6,12}$/.test(alias))?[alias]:[]});
  });
  var mapa={};socios.forEach(function(s){mapa[s.dni]=s;});socios=Object.keys(mapa).map(function(k){return mapa[k];});
  return {socios:socios,invalidos:invalidos,dup:dup,conEstado:iA>=0||iC>=0,porCategoria:iC>=0};
}
function leerArchivo(f){
  st.preview=null;st.previewErr='';
  var rd=new FileReader();
  if(/\.(csv|txt)$/i.test(f.name)){
    rd.onload=function(){var txt=String(rd.result);var sep=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
      var rows=txt.split(/\r?\n/).map(function(l){return l.split(sep).map(function(c){return c.replace(/^"|"$/g,'');});});
      var r=interpretar(rows);if(r.error)st.previewErr=r.error;else st.preview=r;render();};
    rd.readAsText(f,'utf-8');
  } else {
    if(!window.XLSX){st.previewErr='No se pudo cargar el lector de Excel. Guardá el archivo como CSV y subilo de nuevo.';render();return;}
    rd.onload=function(){try{var wb=XLSX.read(rd.result,{type:'array'});var rows=null;wb.SheetNames.some(function(n){var rr=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});if(rr.slice(0,40).some(function(r){return r.some(function(c){return /^(dni|documento)$/.test(normHead(c));});})){rows=rr;st.hoja=n;return true;}return false;});if(!rows){rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});st.hoja=wb.SheetNames[0];}
      var r=interpretar(rows);if(r.error)st.previewErr=r.error;else st.preview=r;}catch(e){st.previewErr='No se pudo leer el archivo. Probá guardarlo como .xlsx o .csv.';}render();};
    rd.readAsArrayBuffer(f);
  }
}
function padronView(){
  var r=st.resumen, p=st.preview;
  var h='<div class="card"><h3>Padrón actual</h3>'+(r?'<p>'+r.padron.total+' socios cargados · <b>'+r.padron.activos+' activos</b> · '+(r.padron.total-r.padron.activos)+' no activos</p><p class="hint">Última carga: '+fmtFecha(r.padron.actualizado)+'</p>':'<p class="muted">Cargando…</p>')+
  '<form class="row" id="buscar"><div class="field" style="flex:1;min-width:200px"><label for="q">Buscar socio por DNI o apellido</label><input id="q" value="'+esc(st.buscar.q)+'"></div><button class="btn ghost" type="submit" style="align-self:flex-end">Buscar</button></form>';
  if(st.buscar.res){h+=st.buscar.res.length?'<div class="scroll"><table><thead><tr><th>DNI</th><th>Nombre</th><th>Condición</th><th>Ingresó</th><th></th></tr></thead><tbody>'+st.buscar.res.map(function(x){return '<tr><td class="mono">'+esc(x.dni)+'</td><td>'+esc(x.nombre)+'</td><td>'+(x.activo?'Habilitado':'No habilitado')+'</td><td>'+(x.presente?'Sí':'No')+'</td><td>'+(x.activo?'<button class="btn ghost small" data-socio="'+esc(x.dni)+'" data-activo="0" data-nombre="'+esc(x.nombre)+'">Quitar habilitación</button>':'<button class="btn primary small" data-socio="'+esc(x.dni)+'" data-activo="1" data-nombre="'+esc(x.nombre)+'">Habilitar</button>')+'</td></tr>';}).join('')+'</tbody></table></div>':'<p class="muted">Sin resultados.</p>';}
  h+='</div>';
  h+='<div class="card"><h3>Cargar padrón</h3><p class="muted">Subí un Excel o CSV con una columna <b>DNI</b>, una de <b>Nombre</b> (o Apellido y Nombre) y una de <b>Estado</b> o <b>Activo</b>. Cuentan como activos: “Sí”, “Activo”, “Habilitado”, “1” o “X”. Si no hay columna de estado, todos se cargan como activos.</p>'+
  '<div class="row"><button class="btn primary" data-elegir="1">Elegir archivo Excel o CSV</button><span class="hint">'+esc(st.archivoNombre||'Ningún archivo elegido')+'</span></div>';
  if(st.previewErr)h+='<div class="status no" role="alert"><p>'+esc(st.previewErr)+'</p></div>';
  if(p){
    var act=p.socios.filter(function(s){return s.activo;}).length;
    h+='<div class="status info"><strong>'+p.socios.length+' socios leídos'+(st.hoja?' (hoja “'+esc(st.hoja)+'”)':'')+'</strong><p>'+act+' activos · '+(p.socios.length-act)+' no activos'+(p.porCategoria?' · votan Titulares y Vitalicios según la columna Categoría':(p.conEstado?'':' (sin columna de estado: todos activos)'))+(p.dup?' · '+p.dup+' DNI repetidos (se toma la última fila)':'')+'</p>'+
    (p.invalidos.length?'<p>Se descartan '+p.invalidos.length+' filas con DNI inválido: '+esc(p.invalidos.slice(0,6).join(' · '))+(p.invalidos.length>6?'…':'')+'</p>':'')+'</div>'+
    '<div class="scroll"><table><thead><tr><th>DNI</th><th>Nombre</th><th>Condición</th></tr></thead><tbody>'+p.socios.slice(0,8).map(function(s){return '<tr><td class="mono">'+esc(s.dni)+'</td><td>'+esc(s.nombre)+'</td><td>'+(s.activo?'Activo':'No activo')+'</td></tr>';}).join('')+'</tbody></table></div>'+
    (p.socios.length>8?'<p class="hint">y '+(p.socios.length-8)+' más.</p>':'')+
    '<div class="row"><button class="btn primary" data-guardarpadron="1">Reemplazar padrón con estos '+p.socios.length+' socios</button><button class="btn ghost" data-descartar="1">Descartar</button></div>';
  }
  h+='</div>';
  h+='<div class="card"><h3>Reiniciar acreditaciones</h3><p class="muted">Borra los ingresos de socios habilitados y de asistentes sin voto. Usalo solo para limpiar las pruebas antes de la asamblea.</p>'+
  (st.resetPres?'<div class="row"><button class="btn danger small" data-resetok="1">Sí, borrar acreditaciones</button><button class="btn ghost small" data-cancelar="1">Cancelar</button></div>':'<button class="btn ghost small" data-reset="1" style="align-self:flex-start">Reiniciar acreditaciones</button>')+'</div>';
  return h;
}

/* ---------- Asistencia ---------- */
function hora(iso){if(!iso)return '—';var d=new Date(iso);return isNaN(d)?'—':d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}
function fecha(iso){if(!iso)return '';var d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('es-AR');}
var MOTIVO={no_figura_en_padron:'No figura en el padrón habilitado',socio_no_activo:'Socio no habilitado'};
function cargarAsistencia(){return api('asistencia').then(function(r){if(r.ok){st.asis=r;render();}});}
function asistenciaView(){
  var a=st.asis,h='<form class="card" id="habilitar"><h3>Habilitar a un socio para votar</h3><p class="muted">Para socios que pasaron por secretaría y regularizaron su situación. Queda habilitado al instante: el socio vuelve a ingresar su DNI y ya puede votar.</p>'+
  '<div class="row" style="align-items:flex-end"><div class="field" style="flex:1;min-width:150px"><label for="h-dni">DNI</label><input id="h-dni" inputmode="numeric" value="'+esc(st.hab.dni)+'"></div><div class="field" style="flex:2;min-width:220px"><label for="h-nombre">Apellido y nombre</label><input id="h-nombre" value="'+esc(st.hab.nombre)+'"></div><button class="btn primary" type="submit">Habilitar</button></div></form>';
  if(!a)return h+'<p class="muted">Cargando asistencia…</p>';
  h+='<div class="spread"><p class="muted">'+a.habilitados.length+' socios habilitados ingresaron · '+a.sinVoto.length+' asistentes sin voto · '+(a.habilitados.length+a.sinVoto.length)+' en total</p><div class="row"><button class="btn ghost small" data-refasis="1">Actualizar</button><button class="btn primary small" data-reporte="1">Descargar reporte de asistencia</button></div></div>';
  h+='<div class="card"><h3>Asistentes sin voto</h3>'+(a.sinVoto.length?'<div class="scroll"><table><thead><tr><th>Hora</th><th>DNI</th><th>Nombre</th><th>Motivo</th><th></th></tr></thead><tbody>'+a.sinVoto.map(function(x){
    return '<tr><td class="mono">'+hora(x.hora)+'</td><td class="mono">'+esc(x.dni)+'</td><td>'+esc(x.nombre)+'</td><td>'+esc(MOTIVO[x.motivo]||x.motivo)+'</td><td>'+(x.habilitadoLuego?'<span class="pill abierta">Habilitado</span>':'<button class="btn primary small" data-socio="'+esc(x.dni)+'" data-activo="1" data-nombre="'+esc(x.nombre)+'">Habilitar para votar</button>')+'</td></tr>';}).join('')+'</tbody></table></div>':'<p class="muted">Nadie se registró sin voto todavía.</p>')+'</div>';
  h+='<div class="card"><h3>Socios habilitados que ingresaron</h3>'+(a.habilitados.length?'<div class="scroll"><table><thead><tr><th>Hora</th><th>DNI</th><th>Nombre</th></tr></thead><tbody>'+a.habilitados.map(function(x){
    return '<tr><td class="mono">'+hora(x.hora)+'</td><td class="mono">'+esc(x.dni)+'</td><td>'+esc(x.nombre)+(x.habilitadoEnSecretaria?' <span class="pill borrador">Habilitado en secretaría</span>':'')+'</td></tr>';}).join('')+'</tbody></table></div>':'<p class="muted">Todavía no ingresó ningún socio.</p>')+'</div>';
  return h;
}
function reporte(){
  var a=st.asis,f=[['Condición','Hora de ingreso','Fecha','DNI','Apellido y nombre','Observación']];
  a.habilitados.forEach(function(x){f.push(['Habilitado para votar',hora(x.hora),fecha(x.hora),x.dni,x.nombre,x.habilitadoEnSecretaria?'Habilitado en secretaría':'']);});
  a.sinVoto.forEach(function(x){f.push([x.habilitadoLuego?'Habilitado en secretaría (aún no reingresó)':'Asistente sin voto',hora(x.hora),fecha(x.hora),x.dni,x.nombre,MOTIVO[x.motivo]||x.motivo]);});
  var txt='\ufeff'+f.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
  var el=document.createElement('a');el.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));el.download='asistencia-asamblea-acacip.csv';document.body.appendChild(el);el.click();el.remove();
}
function habilitar(dni,nombre,activo){
  return api('socio','POST',{dni:dni,nombre:nombre,activo:activo}).then(function(r){
    if(r.ok){toast((r.activo?'Habilitado: ':'Sin habilitación: ')+r.nombre);st.hab={dni:'',nombre:''};cargar();if(st.tab==='asistencia')cargarAsistencia();if(st.buscar.res)api('padron/buscar?q='+encodeURIComponent(st.buscar.q)).then(function(b){st.buscar.res=b.ok?b.resultados:[];render();});}
    else toast(r.mensaje||'No se pudo actualizar.');
    return r;
  });
}

function render(){
  var a=document.activeElement, fid=a&&a.id, pos=a&&a.selectionStart;
  if(!st.pw){view.innerHTML=loginView();return;}
  view.innerHTML='<div style="display:flex;flex-direction:column;gap:16px">'+
    '<div class="spread"><div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="mociones" aria-selected="'+(st.tab==='mociones')+'">Consignas y votación</button><button class="tab" role="tab" data-tab="asistencia" aria-selected="'+(st.tab==='asistencia')+'">Asistencia</button><button class="tab" role="tab" data-tab="padron" aria-selected="'+(st.tab==='padron')+'">Padrón</button></div>'+
    '<div class="row"><a class="btn primary small" href="/pantalla" target="_blank" rel="noopener">Proyectar en pantalla</a><a class="btn ghost small" href="/" target="_blank" rel="noopener">Ver como socio</a><button class="btn ghost small" data-logout="1">Salir</button></div></div>'+
    statsHtml()+(st.tab==='mociones'?mocionesView():st.tab==='asistencia'?asistenciaView():padronView())+'</div>';
  if(fid){var el=document.getElementById(fid);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(e){}}}
}

function csv(){
  var r=st.resumen, filas=[['Consigna','Estado','Opción','Votos','% de votos emitidos','Total votos','Socios que votaron','Presentes']];
  r.mociones.filter(function(m){return m.estado!=='borrador';}).forEach(function(m){var t=m.resultados.total||0;m.opciones.forEach(function(o){var n=m.resultados[o.id]||0;filas.push([m.titulo,m.estado,o.texto,n,t?(Math.round(n*1000/t)/10+'').replace('.',','):'0',t,m.votantes,r.presentes]);});});
  var txt='﻿'+filas.map(function(f){return f.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download='resultados-asamblea-acacip.csv';document.body.appendChild(a);a.click();a.remove();
}
function accion(p){return p.then(function(r){if(!r.ok)toast(r.mensaje||'No se pudo completar.');return cargar().then(function(){return r;});});}

view.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='login'){var pw=document.getElementById('pw').value;st.pw=pw;
    api('login','POST').then(function(r){if(r.ok){sput(PK,pw);st.loginMsg='';render();cargar();}else{st.pw='';st.loginMsg=r._status===401?'Contraseña incorrecta.':(r.mensaje||'No se pudo ingresar.');render();}});return;}
  if(e.target.id==='nueva'){var t=st.nueva.titulo.trim();if(!t){toast('Escribí la consigna');return;}
    var nv=st.nueva,ops=nv.opciones.map(function(x){return x.trim();}).filter(Boolean);
    if(nv.tipo==='opciones'&&ops.length<2){toast('Cargá al menos dos opciones');return;}
    accion(api('mociones','POST',{titulo:t,detalle:nv.detalle,tipo:nv.tipo,opciones:ops,abstencion:nv.abstencion})).then(function(r){if(r.ok){st.nueva={titulo:'',detalle:'',tipo:'sino',opciones:['','',''],abstencion:false};render();toast('Consigna agregada');}});return;}
  if(e.target.id==='habilitar'){var hd=st.hab.dni.replace(/\D/g,''),hn=st.hab.nombre.trim();if(hd.length<6){toast('Revisá el DNI');return;}habilitar(hd,hn,true);return;}
  if(e.target.id==='buscar'){api('padron/buscar?q='+encodeURIComponent(st.buscar.q)).then(function(r){st.buscar.res=r.ok?r.resultados:[];render();});}
});
view.addEventListener('input',function(e){
  if(e.target.id==='n-titulo')st.nueva.titulo=e.target.value;
  if(e.target.id==='n-detalle')st.nueva.detalle=e.target.value;
  var mo=e.target.id&&e.target.id.match(/^n-op-(\d+)$/);if(mo)st.nueva.opciones[+mo[1]]=e.target.value;
  if(e.target.id==='q')st.buscar.q=e.target.value;
  if(e.target.id==='h-dni')st.hab.dni=e.target.value;
  if(e.target.id==='h-nombre')st.hab.nombre=e.target.value;
});
document.getElementById('archivo').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(!f)return;st.archivoNombre=f.name;leerArchivo(f);e.target.value='';});
view.addEventListener('change',function(e){
  if(e.target.name==='n-tipo'){st.nueva.tipo=e.target.value;render();}
  if(e.target.id==='n-abs')st.nueva.abstencion=e.target.checked;
});
view.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;var d=t.dataset;
  if(d.tab){st.tab=d.tab;render();if(d.tab==='asistencia')cargarAsistencia();return;}
  if(d.socio){t.disabled=true;habilitar(d.socio,d.nombre,d.activo==='1');return;}
  if(d.refasis){cargarAsistencia();return;}
  if(d.reporte){reporte();return;}
  if(d.agregarop){st.nueva.opciones.push('');render();var el=document.getElementById('n-op-'+(st.nueva.opciones.length-1));if(el)el.focus();return;}
  if(d.quitarop){st.nueva.opciones.splice(+d.quitarop,1);render();return;}
  if(d.elegir){document.getElementById('archivo').click();return;}
  if(d.logout){st.pw='';sput(PK,null);st.resumen=null;render();return;}
  if(d.estado){accion(api('mociones/'+d.id,'PATCH',{estado:d.estado})).then(function(r){if(r.ok)toast(d.estado==='abierta'?'Votación abierta':'Votación cerrada');});return;}
  if(d.publicar){accion(api('mociones/'+d.id,'PATCH',{publicar:d.publicar==='1'}));return;}
  if(d.mover){accion(api('mociones/'+d.id,'PATCH',{mover:+d.mover}));return;}
  if(d.editar){st.editando=d.editar;render();return;}
  if(d.guardar){var id=d.guardar;accion(api('mociones/'+id,'PATCH',(function(){var b={titulo:document.getElementById('et-'+id).value,detalle:document.getElementById('ed-'+id).value};var eo=document.getElementById('eo-'+id);if(eo)b.opciones=eo.value.split('\n').map(function(x){return x.trim();}).filter(Boolean);return b;})())).then(function(){st.editando=null;render();});return;}
  if(d.cancelar){st.editando=null;st.borrar=null;st.resetPres=false;render();return;}
  if(d.borrar){st.borrar=d.borrar;render();return;}
  if(d.borrarok){st.borrar=null;accion(api('mociones/'+d.borrarok,'DELETE')).then(function(r){if(r.ok)toast('Consigna eliminada');});return;}
  if(d.csv){csv();return;}
  if(d.descartar){st.preview=null;render();return;}
  if(d.guardarpadron){var p=st.preview;t.disabled=true;accion(api('padron','PUT',{socios:p.socios})).then(function(r){if(r.ok){st.preview=null;render();toast('Padrón guardado: '+r.total+' socios');}});return;}
  if(d.reset){st.resetPres=true;render();return;}
  if(d.resetok){st.resetPres=false;accion(api('presentes','DELETE')).then(function(r){if(r.ok){toast('Acreditaciones borradas');st.asis=null;}});return;}
});

st.pw=sget(PK)||'';
render();
if(st.pw)cargar();
setInterval(function(){if(st.pw&&!document.hidden&&!st.editando&&st.tab==='mociones')cargar();},3000);
setInterval(function(){if(st.pw&&!document.hidden&&st.tab==='asistencia'){cargar();cargarAsistencia();}},10000);
})();
</script>
</body>
</html>
